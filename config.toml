baseURL = "https://blog.chann.kr"
publishDir = "./docs"
title = "CHANN's Dev Log"
# for smart copyright line, leave this blank and check [params.copyright]
copyright = ""

theme = "minimo"

disqusShortname = "channprj"
googleAnalytics = ""

Paginate = 5
preserveTaxonomyNames = true

enableRobotsTXT = true # generate robots.txt

# Syntax Highlighting ( https://gohugo.io/content-management/syntax-highlighting/ )
pygmentsCodefences = true

# Language Configuration
defaultContentLanguage = "ko"

[params.info]
description = ""
title404 = "404 Not Found"

[params.assets]
favicon = "favicon.ico"
customCSS = ["css/custom.css"]
customJS = ["js/custom.js"]
gopher = "" # used in 404 template ( Generator: https://gopherize.me )

[params.copyright]
prefix = ""
holder = "CHANN"
startYear = "2017"
suffix = ""

[params.settings]
# date & time format: https://golang.org/pkg/time/
dateFormat = "2006, Jan 02"
listDateFormat = "2006, Jan 02"
hideEntryNavigation = ["page"] # boolean / array of sections
hideSocialMenu = false
showReadingTime = true

[params.opengraph.facebook]
admins = [] # array of Facebook IDs
appID = ""
pageID = ""

[params.opengraph.twitter]
page = "" # Twitter page username

[params.seo]
# Title Separator: - – — · • * ⋆ | ~ « » < >
titleSeparator = "•"

[params.social]
codepen = "channprj"
email = "chann@chann.kr"
facebook = "channprj"
github = "channprj"
instagram = "channprj"
linkedin = "channprj"
twitter = "channprj"

[params.social.config]
platforms = [
    "github",
    "facebook",
    "twitter",
    "instagram",
    "email",
    "codepen",
    "linkedin"
]

[taxonomies]
author = "authors"
category = "categories"
tag = "tags"

[permalinks]
page = "/:slug"

[[menu.main]]
name = "저장소"
weight = -10
identifier = "repository"
url = "https://github.com/channprj/blog"

[blackfriday]
hrefTargetBlank = true

[languages]
# edit this block for your own language

[languages.ko]
lang = "ko"
languageName = "Korean"
weight = 1

[languages.en]
lang = "en"
languageName = "English"
weight = 1
